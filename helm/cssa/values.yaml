# Default values for tech-club.
#
# HOW THIS IS DEPLOYED
# The wu-tech-cluster chart renders one Argo CD Application per entry in its
# `applications:` list, and this chart is the `wu-tech-website` entry. That
# umbrella hands this chart exactly three things, so everything here must work
# from just those:
#
#   1. The release name = the app name (`wu-tech-website`). No fullnameOverride
#      is passed, so resources are named "wu-tech-website-tech-club-*".
#   2. `values:` -> ingress.host and global.security.allowInsecureImages.
#   3. `parameters:` -> image.server.name, built from the `images:` alias
#      (`server`) and rewritten by argocd-image-updater. Hence image.server.*
#      below; renaming that key breaks the Application's --set.
#
# Two properties of that Application's sync policy shape this chart:
#
#   ignoreDifferences: [{kind: Secret, jsonPointers: [/data, /stringData]}]
#   syncOptions: [RespectIgnoreDifferences=true]
#
#   - Secret contents are WRITE-ONCE. Argo CD strips data/stringData from what
#     it applies to an existing Secret, so a Secret rendered by this chart gets
#     its contents on create and is never corrected again. This chart therefore
#     renders no Secrets at all: DATABASE_URL is assembled inside the pod from
#     the PostgreSQL subchart's own Secret, and the app's own credentials live
#     in a hand-made Secret (see helm/README.md).
#   - `prune` is NOT enabled. Dropping a template from this chart leaves the
#     live object orphaned in the cluster; delete those by hand.

replicaCount: 1

image:
  # "server" is the alias from the cluster chart's `images:` list, which renders
  # --set image.server.name=<repo>. argocd-image-updater writes the same path.
  server:
    name: ghcr.io/willamette-tech/website
    tag: "latest"
  # CI publishes linux/amd64 only (see .github/workflows/build.yaml), so every
  # node running this must be amd64.
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  enabled: true
  className: traefik
  # The one value the cluster chart overrides, as a plain scalar:
  #   values: {ingress: {host: wu-tech.club}}
  # It also feeds NEXTAUTH_URL below, so it must be the public hostname.
  host: techclub.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    # Matches the existing cert-manager Certificate in the cssa namespace;
    # renaming it makes cert-manager issue a fresh certificate.
    secretName: tech-club-tls

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Non-secret environment variables, rendered into the ConfigMap verbatim.
env:
  NODE_ENV: production
  # Server-side timezone used for date/time rendering (SSR). Pacific w/ DST.
  # Requires tzdata in the runtime image (see Dockerfile).
  TZ: America/Los_Angeles
  # NEXTAUTH_URL is derived from ingress.host (https://<host>) when it is not
  # set here. The cluster chart passes no env overrides, so leave it unset and
  # let ingress.host drive it; setting it wins over the derived value.
  # NEXTAUTH_URL: https://techclub.example.com

# Secret holding the app's own credentials: NEXTAUTH_SECRET, GITHUB_CLIENT_ID,
# GITHUB_CLIENT_SECRET. Created by hand, because Argo CD freezes Secret data
# (see the header). Defaults to <fullname>-secrets; the app will not start
# until it exists. helm/README.md has the kubectl command.
existingSecret: ""

# PostgreSQL subchart configuration
postgresql:
  enabled: true
  image:
    # Bitnami moved versioned tags to bitnamilegacy; the subchart rejects a
    # non-standard repository unless the Application also passes
    # global.security.allowInsecureImages=true, which the cluster chart does.
    repository: "bitnamilegacy/postgresql"
    tag: "17"  # Use major version tag for stability
  auth:
    postgresPassword: "changeme-postgres-admin"
    # NOTE: must stay "cssa" — the live PostgreSQL PVC was initialized with
    # this role/database name. Bitnami only creates the user/db on first init,
    # so renaming here does NOT rename them in an existing database and will
    # break auth for every new pod. Change only alongside a real DB migration.
    username: cssa
    # Goes into DATABASE_URL as a URL userinfo field, so keep it to characters
    # that need no percent-encoding (alphanumerics, '-', '_', '.', '~').
    password: "changeme-techclub-password"
    database: cssa
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  # Metrics for monitoring (optional)
  metrics:
    enabled: false

# Database migrations
migrations:
  # Run `prisma db push` in an init container on every pod start, so the DB
  # schema always matches the deployed image. Argo CD syncing a new image tag
  # therefore applies schema changes with no extra step. A failed sync blocks
  # the rollout (pod stays in Init).
  enabled: true

# Health check configuration
healthCheck:
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
