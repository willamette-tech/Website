{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tech-club.fullname" . }}-db-url
  labels:
    {{- include "tech-club.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "tech-club.postgresqlHost" . }}:5432/{{ .Values.postgresql.auth.database }}"
{{- end }}
