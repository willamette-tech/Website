{{- /*
  Legacy Helm post-upgrade hook. Superseded by the db-migrate init container in
  deployment.yaml, which also covers plain pod restarts. Opt in with
  migrations.hookJob=true if you specifically want migrations gated on
  `helm upgrade` instead.
*/ -}}
{{- if .Values.migrations.hookJob }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tech-club.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "tech-club.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "tech-club.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "tech-club.postgresqlHost" . }} 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Running database migrations..."
              npx prisma@6 db push --accept-data-loss
              echo "Migrations complete!"
          envFrom:
            - configMapRef:
                name: {{ include "tech-club.fullname" . }}-config
            - secretRef:
                name: {{ include "tech-club.secretName" . }}
                optional: true
          {{- if .Values.postgresql.enabled }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tech-club.fullname" . }}-db-url
                  key: DATABASE_URL
          {{- end }}
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
{{- end }}
