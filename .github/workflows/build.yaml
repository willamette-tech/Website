name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # Single-architecture (amd64) build on a native amd64 runner. `npm ci`,
  # `prisma generate` and `next build` are all CPU-bound, so this must never go
  # back to building a foreign architecture through QEMU.
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      # GHCR rejects capitalised paths and this repo is willamette-tech/Website,
      # so lowercase it rather than relying on metadata-action to do it for us.
      - name: Prepare environment
        run: echo "IMAGE=${REGISTRY}/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope kept from when this was an arch matrix, so the existing warm
          # amd64 cache still hits.
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
          # On PR: build only, to validate the change.
          push: ${{ github.event_name != 'pull_request' }}

      - name: Inspect image
        if: github.event_name != 'pull_request'
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
